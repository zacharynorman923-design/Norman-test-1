name: Deploy to GitHub Pages

# Publishes the static site (repo root) to GitHub Pages.
# Enable it under Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches:
      - main
      - master
      - claude/split-program-builder-6pp6pk
      - claude/workout-routine-scheduler-yxaugi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
